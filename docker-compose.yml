services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: etherscope
      POSTGRES_PASSWORD: etherscope
      POSTGRES_DB: etherscope
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etherscope -d etherscope"]
      interval: 5s
      timeout: 5s
      retries: 10

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8545"
      - "--block-time"
      - "1"
    ports:
      - "8545:8545"

volumes:
  postgres_data:
